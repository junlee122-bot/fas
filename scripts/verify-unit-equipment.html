<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>부대 장비 지급 · 격리 검증</title>
  <style>
    :root { color-scheme: dark; font-family: "Malgun Gothic", "Segoe UI", sans-serif; color: #e7eadf; background: #101b15; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .issue-fixture { padding: 26px; max-width: 1420px; margin: 0 auto; }
    .issue-fixture > header { margin-bottom: 18px; }
    .issue-fixture > header h1 { font-size: 24px; margin: 0 0 10px; }
    .issue-fixture > header p { color: #bdc8b9; line-height: 1.7; font-size: 14px; }
    .issue-fixture-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; padding: 16px 0; }
    .issue-fixture-controls button, .issue-fixture-controls select { min-height: 42px; padding: 9px 13px; color: #e7eadf; border: 1px solid #586950; background: #233629; font: inherit; border-radius: 4px; }
    .issue-fixture-controls label { display: flex; align-items: center; gap: 8px; }
    .issue-fixture-controls :focus-visible { outline: 3px solid #d0b47b; outline-offset: 3px; }
    .issue-fixture-counters { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 16px; }
    .issue-fixture-counters output { padding: 9px 13px; border: 1px solid #45593f; color: #dbc99c; font-variant-numeric: tabular-nums; }
    .issue-fixture-status { padding: 12px 15px; margin: 0 0 18px; border-left: 3px solid #d0b47b; background: #223026; line-height: 1.7; }
    .issue-fixture > details { margin: 20px 0; }
    .issue-fixture > details summary { min-height: 42px; padding: 12px 0; cursor: pointer; }
    .issue-fixture pre { padding: 16px; background: #0b140f; overflow: auto; max-height: 380px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body><div id="root"></div><script type="module" src="./verify-unit-equipment.tsx"></script></body>
</html>
