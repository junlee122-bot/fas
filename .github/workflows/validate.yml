name: Validate Iron Dominion

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - agent/expand-campaign-depth
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate types, tests, geography and production build
        run: npm run ci
