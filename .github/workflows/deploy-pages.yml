name: Deploy Iron Dominion to GitHub Pages

on:
  push:
    branches:
      - main
      - agent/expand-campaign-depth
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Publishing branches share a lock; other refs cannot cancel a live deployment.
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/expand-campaign-depth') && 'pages' || format('pages-review-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  build:
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/agent/expand-campaign-depth' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build GitHub Pages site
        run: npm run build:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
